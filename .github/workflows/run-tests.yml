name: Acceptance Tests

on:
  push:
    branches:
      - main
      - master

env:
  NODE_VERSION: 22
  CI_BUILD_NUMBER: ${{ github.run_number }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - run: npm i
      - run: npm run lint

  acceptance-tests:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: |
          npm i
          npx playwright install

      # Restore previous Allure history if available
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4

      - name: Copy history to results
        run: |
          mkdir -p ./output/allure/history
          if [ -d "./output/allure/history" ]; then
            cp -R ./output/allure/history ./output/allure/
          fi

      - name: Run tests and generate Allure report
        run: |
          npm run test
          npm run allure-reports-generate
          npm run allure-reports-patch

        env:
          MAILINATOR_TOKEN: ${{ secrets.MAILINATOR_TOKEN }}
          MAILINATOR_DOMAIN: ${{ secrets.MAILINATOR_DOMAIN }}

      # Upload new Allure history
      - name: Upload Allure history
        uses: actions/upload-artifact@v3
        with:
          name: allure-history
          path: ./output/allure/history

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Check artifact directory
        run: |
          if [ ! -d "./output/allure" ]; then
            echo "Artifact directory not found. Exiting."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output/allure'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

