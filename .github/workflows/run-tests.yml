name: Acceptance Tests

on:
  push:
    branches:
      - main
      - master

env:
  NODE_VERSION: 22

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - run: npm i
      - run: npm run lint

  acceptance-tests:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - name: install deps
        run: |
          npm i
      - name: Run tests
        working-directory: ./test
        run: |
          npm i && npx playwright install
          npm run test && npm run allure-reports-generate && npm run allure-reports-patch
        env:
          MAILINATOR_TOKEN: ${{secrets.MAILINATOR_TOKEN}}
          MAILINATOR_DOMAIN: ${{secrets.MAILINATOR_DOMAIN}}
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Check artifact directory
        run: |
          if [ ! -d "./test/output/allure" ]; then
            echo "Artifact directory not found. Exiting."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './test/output/allure'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
